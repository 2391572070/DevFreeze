[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devfreeze"
version = "0.1.0"
description = "A local-first, review-before-resume development context snapshot CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["developer-tools", "cli", "git", "workflow", "snapshot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/2391572070/DevFreeze"
Documentation = "https://github.com/2391572070/DevFreeze#readme"
Changelog = "https://github.com/2391572070/DevFreeze/blob/main/CHANGELOG.md"
Issues = "https://github.com/2391572070/DevFreeze/issues"
Source = "https://github.com/2391572070/DevFreeze"

[project.scripts]
devfreeze = "devfreeze.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
